name: Workspace cleanup migration patch

on:
  push:
    branches:
      - 'feat/v2-workspaces'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[workspace-cleanup-patch]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-workspaces
          fetch-depth: 0

      - name: Apply exact Workspace-scope patches
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new))

          def replace_all(path, old, new, expected):
              replace_exact(path, old, new, expected)

          # SourceMigrationService: discovery is Active-Workspace scoped.
          path = 'src/sources/services/source-migration-service.ts'
          replace_exact(path,
          """\tconstructor(\n\t\tprivate app: App,\n\t\tprivate settings: CanvasRootsSettings\n\t) {}""",
          """\tconstructor(\n\t\tprivate app: App,\n\t\tprivate settings: CanvasRootsSettings,\n\t\tprivate readonly fileProvider?: () => TFile[]\n\t) {}\n\n\tprivate getFiles(): TFile[] {\n\t\treturn this.fileProvider?.() ?? this.app.vault.getMarkdownFiles();\n\t}""")
          replace_all(path,
          "\t\tconst files = this.app.vault.getMarkdownFiles();",
          "\t\tconst files = this.getFiles();", 1)

          # SourcedFactsMigrationService: detection/notice stay inside Active Workspace.
          path = 'src/sources/services/sourced-facts-migration-service.ts'
          replace_exact(path,
          """\tconstructor(\n\t\tprivate app: App,\n\t\tprivate settings: CanvasRootsSettings\n\t) {}""",
          """\tconstructor(\n\t\tprivate app: App,\n\t\tprivate settings: CanvasRootsSettings,\n\t\tprivate readonly fileProvider?: () => TFile[]\n\t) {}\n\n\tprivate getFiles(): TFile[] {\n\t\treturn this.fileProvider?.() ?? this.app.vault.getMarkdownFiles();\n\t}""")
          replace_all(path,
          "\t\tconst files = this.app.vault.getMarkdownFiles();",
          "\t\tconst files = this.getFiles();", 2)

          # EventPersonMigrationService: detection/notice stay inside Active Workspace.
          path = 'src/events/services/event-person-migration-service.ts'
          replace_exact(path,
          """\tconstructor(\n\t\tprivate app: App,\n\t\tprivate settings: CanvasRootsSettings\n\t) {}""",
          """\tconstructor(\n\t\tprivate app: App,\n\t\tprivate settings: CanvasRootsSettings,\n\t\tprivate readonly fileProvider?: () => TFile[]\n\t) {}\n\n\tprivate getFiles(): TFile[] {\n\t\treturn this.fileProvider?.() ?? this.app.vault.getMarkdownFiles();\n\t}""")
          replace_all(path,
          "\t\tconst files = this.app.vault.getMarkdownFiles();",
          "\t\tconst files = this.getFiles();", 2)

          # LifeEventsMigrationService: source scan, duplicate detection and output folder
          # all belong to the Active Workspace.
          path = 'src/events/services/life-events-migration-service.ts'
          replace_exact(path,
          """\tconstructor(\n\t\tprivate app: App,\n\t\tprivate settings: CanvasRootsSettings\n\t) {}""",
          """\tconstructor(\n\t\tprivate app: App,\n\t\tprivate settings: CanvasRootsSettings,\n\t\tprivate readonly fileProvider?: () => TFile[],\n\t\tprivate readonly eventsFolderProvider?: () => string\n\t) {}\n\n\tprivate getFiles(): TFile[] {\n\t\treturn this.fileProvider?.() ?? this.app.vault.getMarkdownFiles();\n\t}""")
          replace_all(path,
          "\t\tconst files = this.app.vault.getMarkdownFiles();",
          "\t\tconst files = this.getFiles();", 3)
          replace_exact(path,
          "\t\tconst eventsFolder = this.settings.eventsFolder || 'Charted Roots/Events';",
          "\t\tconst eventsFolder = this.eventsFolderProvider?.()\n\t\t\t?? this.settings.eventsFolder\n\t\t\t?? 'Charted Roots/Events';")

          # Cleanup Wizard: one shared Active-Workspace provider for all destructive scans.
          path = 'src/ui/cleanup-wizard-modal.ts'
          replace_exact(path,
          """\tprivate getGeocodingService(): GeocodingService {\n\t\tif (!this.geocodingService) {\n\t\t\tthis.geocodingService = new GeocodingService(this.app);\n\t\t}\n\t\treturn this.geocodingService;\n\t}\n""",
          """\tprivate getGeocodingService(): GeocodingService {\n\t\tif (!this.geocodingService) {\n\t\t\tthis.geocodingService = new GeocodingService(this.app);\n\t\t}\n\t\treturn this.geocodingService;\n\t}\n\n\t/** Active Workspace is the primary safety boundary for destructive cleanup. */\n\tprivate getWorkspaceFiles(): TFile[] {\n\t\treturn this.plugin.getWorkspaceService()?.getScope().getMarkdownFiles()\n\t\t\t?? this.app.vault.getMarkdownFiles();\n\t}\n""")

          replace_exact(path,
          "\t\t\tthis.sourceMigrationService = new SourceMigrationService(this.app, this.plugin.settings);",
          "\t\t\tthis.sourceMigrationService = new SourceMigrationService(\n\t\t\t\tthis.app,\n\t\t\t\tthis.plugin.settings,\n\t\t\t\t() => this.getWorkspaceFiles()\n\t\t\t);")
          replace_exact(path,
          "\t\t\tthis.eventPersonMigrationService = new EventPersonMigrationService(this.app, this.plugin.settings);",
          "\t\t\tthis.eventPersonMigrationService = new EventPersonMigrationService(\n\t\t\t\tthis.app,\n\t\t\t\tthis.plugin.settings,\n\t\t\t\t() => this.getWorkspaceFiles()\n\t\t\t);")
          replace_exact(path,
          "\t\t\tthis.sourcedFactsMigrationService = new SourcedFactsMigrationService(this.app, this.plugin.settings);",
          "\t\t\tthis.sourcedFactsMigrationService = new SourcedFactsMigrationService(\n\t\t\t\tthis.app,\n\t\t\t\tthis.plugin.settings,\n\t\t\t\t() => this.getWorkspaceFiles()\n\t\t\t);")
          replace_exact(path,
          "\t\t\tthis.lifeEventsMigrationService = new LifeEventsMigrationService(this.app, this.plugin.settings);",
          "\t\t\tthis.lifeEventsMigrationService = new LifeEventsMigrationService(\n\t\t\t\tthis.app,\n\t\t\t\tthis.plugin.settings,\n\t\t\t\t() => this.getWorkspaceFiles(),\n\t\t\t\t() => this.plugin.getWorkspaceService()?.getFolder('events')\n\t\t\t\t\t?? this.plugin.settings.eventsFolder\n\t\t\t);" )

          # Step 14 and Step 15 were the two direct whole-vault loops remaining
          # in the modal itself.
          replace_all(path,
          "\t\tfor (const file of this.app.vault.getMarkdownFiles()) {",
          "\t\tfor (const file of this.getWorkspaceFiles()) {", 2)

          # One-shot workflow removes itself in the same commit.
          Path('.github/workflows/workspace-cleanup-patch.yml').unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(workspaces): scope destructive cleanup migrations"
          git push origin HEAD:feat/v2-workspaces
