name: Tyme lock helper

on:
  pull_request:
    branches:
      - feat/v2-foundation

permissions:
  contents: read

jobs:
  generate:
    name: Generate Tyme package lock
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Generate package metadata
        run: npm install --save --package-lock-only --ignore-scripts tyme4ts@1.5.2

      - name: Show dependency diff
        run: git diff -- package.json package-lock.json

      - name: Upload generated package files
        uses: actions/upload-artifact@v4
        with:
          name: tyme-package-lock-${{ github.sha }}
          path: |
            package.json
            package-lock.json
          retention-days: 1
